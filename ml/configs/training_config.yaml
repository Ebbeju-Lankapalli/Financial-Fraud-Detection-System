# ============================================================
# Financial Fraud Detection System
# QLoRA Training Configuration
# ============================================================


# ============================================================
# Reproducibility
# ============================================================

seed: 42


# ============================================================
# Sequence Processing
# ============================================================

sequence:
  max_length: 512


# ============================================================
# Training
# ============================================================

training:
  output_dir: "./fraud-detector-qwen"

  num_train_epochs: 3

  per_device_train_batch_size: 4

  gradient_accumulation_steps: 2

  learning_rate: 0.0002

  weight_decay: 0.01

  warmup_ratio: 0.03

  lr_scheduler_type: "cosine"

  max_grad_norm: 0.3


# ============================================================
# Precision
# ============================================================

precision:
  fp16: true

  bf16: false


# ============================================================
# Memory Optimization
# ============================================================

memory:
  gradient_checkpointing: true


# ============================================================
# Optimizer
# ============================================================

optimizer:
  name: "paged_adamw_8bit"


# ============================================================
# Logging
# ============================================================

logging:
  logging_strategy: "steps"

  logging_steps: 10

  report_to: "none"


# ============================================================
# Checkpoint Saving
# ============================================================

saving:
  save_strategy: "epoch"

  save_total_limit: 3


# ============================================================
# Dataset Processing
# ============================================================

dataset:
  packing: false

  remove_unused_columns: true


# ============================================================
# Generation / Evaluation
# ============================================================

evaluation:
  max_new_tokens: 10