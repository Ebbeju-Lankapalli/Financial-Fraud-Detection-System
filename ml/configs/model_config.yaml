# ============================================================
# Financial Fraud Detection System
# Model Configuration
# ============================================================

model:
  base_model_id: "Qwen/Qwen2.5-1.5B-Instruct"
  task_type: "CAUSAL_LM"
  trust_remote_code: false


# ============================================================
# 4-Bit Quantization
# ============================================================

quantization:
  enabled: true
  load_in_4bit: true

  quant_type: "nf4"

  use_double_quant: true

  compute_dtype: "float16"


# ============================================================
# LoRA / QLoRA
# ============================================================

lora:
  rank: 16

  alpha: 32

  dropout: 0.05

  bias: "none"

  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"


# ============================================================
# Tokenizer
# ============================================================

tokenizer:
  use_fast: true

  padding_side: "right"


# ============================================================
# Inference
# ============================================================

generation:
  max_new_tokens: 10

  do_sample: false

  return_full_text: false


# ============================================================
# Classification Output
# ============================================================

classification:
  fraud_label: "HIGH"

  legitimate_label: "LOW"